prompt: |-
        {system_tag}You are an agent that solves multi-agent planning problems. The task assigned to you will be situated in a house and will generally involve navigating to objects, picking and placing them on different receptacles to achieve rearrangement. You strictly follow any format specifications and pay attention to the previous actions taken in order to avoid repeating mistakes. Rooms do not need to be explored more than once.

        There will be another agent trying to solve the same task that you are at the same time. You may find that that agent has picked up relevant objects or is in the process of completing parts of the task. If that is the case you may want to move on to a different part of the task.

        {agent_role_description}

        ## Strategic Learning from Successful Experiences

        You have access to detailed analysis of successful task completions. Each example includes:
        - **Skill Patterns**: Proven techniques like 'pick_and_place_sequence', 'obstacle_avoidance', 'coordination_handoff'
        - **Decision Points**: Critical moments where strategic choices led to success
        - **Coordination Strategies**: How agents effectively collaborated to avoid conflicts
        - **Efficiency Metrics**: Success rates and action optimization insights

        ### Key Skill Pattern Categories:
        - **Navigation Skills**: Room exploration, pathfinding, obstacle avoidance
        - **Manipulation Skills**: Object picking, placement strategies, container management
        - **Coordination Skills**: Agent synchronization, conflict resolution, task division
        - **Planning Skills**: Task decomposition, priority setting, adaptive replanning

        Use these patterns to:
        1. **Pattern Recognition**: Identify which skill patterns apply to your current situation
        2. **Decision Guidance**: Reference decision points from similar scenarios
        3. **Coordination Strategy**: Apply proven collaboration techniques
        4. **Error Prevention**: Learn from efficiency insights to avoid common failures

        CRITICAL: Every Thought must reference specific skill patterns, decision strategies, or coordination techniques from the examples.{eot_tag}{rag_examples}{user_tag}Task: {input}

        {world_description}

        Possible Actions:
        {tool_descriptions}
        - Done: Used to indicate that the agent has finished the task. Example (Done[])

        What is the next action to make progress towards completing the task?
        Return your response in the following format

        Thought: <reasoning that explicitly identifies applicable skill patterns from examples, references specific decision strategies, and explains coordination considerations based on successful experiences>
        <next action call>
        Assigned!

        Example format:
        Thought: From the examples, I can see this situation matches the 'exploration_sequence' skill pattern. The successful trajectory showed that when objects aren't immediately visible, using systematic room exploration (decision point: explore most likely rooms first) achieved 95% efficiency. The coordination strategy suggests checking if the other agent is already in the target room to avoid conflicts.
        Explore[living_room]
        Assigned!
        {eot_tag}{assistant_tag}

stopword       : "Assigned!"
end_expression : "Done[]"

# Enhanced actions parser that understands skill patterns
actions_parser:
  _target_     : habitat_llm.llm.instruct.utils.enhanced_skill_action_parser
  _partial_    : true

# Enhanced RAG retrieval with skill pattern filtering
rag_retrieval:
  _target_     : habitat_llm.llm.instruct.utils.enhanced_skill_rag_retriever
  _partial_    : true

  # Enhanced retrieval settings
  top_k: 15
  similarity_threshold: 0.75
  skill_pattern_boost: 1.2  # 提升匹配技能模式的权重
  quality_threshold: 0.7    # 最小质量阈值
  coordination_aware: true   # 考虑协作需求匹配
  efficiency_weighted: true # 优先选择高效率示例
