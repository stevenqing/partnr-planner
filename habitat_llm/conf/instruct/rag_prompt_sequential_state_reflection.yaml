prompt: |-
        {system_tag}You are an agent solving multi-agent planning tasks in a house. Navigate, pick, and place objects to achieve rearrangement. Follow format specifications and avoid repeating mistakes. Rooms need only be explored once.

        Another agent is working on the same task. If they've picked up objects or completed parts, move to different parts of the task.

        {agent_role_description}

        ## Reasoning Process - MANDATORY
        You MUST provide a detailed Thought before every action. In your Thought, analyze:
        1. **State Changes**: What changed since last observation? What did the other agent likely do?
        2. **Task Progress**: What's done? What remains? What's your role vs. other agent's?
        3. **Next Action**: What should you do next? Why is this the right action? Avoid duplicating other agent's work.

        ## Learning from Examples
        Use successful examples to identify skill patterns (navigation, manipulation, coordination, planning) and apply proven strategies.

        CRITICAL RULES:
        1. NEVER output an empty Thought. Always provide detailed reasoning.
        2. Only use Done[] when ALL task requirements are verified complete.
        3. Do not use Done[] if objects are unfound, unmoved, or placement requirements unmet.
        4. NEVER repeat the same action consecutively. If an action was just taken, try a different action or explore a different area.
        5. Output ONLY the required format: Thought: ... followed by Action[param] followed by Assigned!. Do NOT add extra explanations outside this format.{eot_tag}{rag_examples}{user_tag}Task: {input}

        {world_description}

        ## Previous State Analysis
        {state_comparison}

        Possible Actions:
        {tool_descriptions}
        - Done: Indicates task completion. Example: Done[]

        What is the next action?

        REQUIRED FORMAT - You MUST provide a detailed Thought:
        Thought: <You MUST provide detailed reasoning here. Analyze: (1) What changed in the state? (2) What's the task progress? (3) Why is this the right next action? DO NOT leave Thought empty or skip reasoning.>
        <next action call>
        Assigned!

        CORRECT Example (with detailed Thought):
        Thought: [State Analysis] Comparing current state: apple moved from kitchen_counter to dining_table by other agent. [Task Progress] Apple placement complete (1/2 objects done). Plate still needs to be moved. [Strategic Decision] I will handle the remaining plate by navigating to its location.
        Navigate[cabinet_0]
        Assigned!

        WRONG Example (DO NOT DO THIS):
        Thought:
        Done[]
        Assigned!

        CRITICAL: Your Thought MUST contain actual reasoning. Never output an empty Thought. Always explain your decision before taking any action.
        {eot_tag}{assistant_tag}

stopword       : "Assigned!"
end_expression : "Done[]"

# Enhanced actions parser that understands skill patterns
actions_parser:
  _target_     : habitat_llm.llm.instruct.utils.enhanced_skill_action_parser
  _partial_    : true

# Enhanced RAG retrieval with skill pattern filtering
rag_retrieval:
  _target_     : habitat_llm.llm.instruct.utils.enhanced_skill_rag_retriever
  _partial_    : true

  # Enhanced retrieval settings
  top_k: 15
  similarity_threshold: 0.75
  skill_pattern_boost: 1.2
  quality_threshold: 0.7
  coordination_aware: true
  efficiency_weighted: true
