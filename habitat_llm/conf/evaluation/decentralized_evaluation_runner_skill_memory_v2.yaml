defaults:
  - /agent@agents.agent_0.config: oracle_rearrange_agent
  - /agent@agents.agent_1.config: oracle_rearrange_object_states_agent

  - /planner@agents.agent_1.planner: skill_memory_v2_planner
  - /planner@agents.agent_0.planner: skill_memory_v2_planner

type: "decentralized"
truncate_length: 50  # max characters in file name, long files names can raise OS errors
save_video: True
output_dir: ${hydra:runtime.output_dir}

agents:
  agent_0:
    uid: 0
  agent_1:
    uid: 1
