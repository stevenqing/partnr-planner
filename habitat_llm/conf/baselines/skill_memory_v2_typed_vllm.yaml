# @package _global_
# skill_memory_v2_vllm.yaml with the typed requirement interface: identical world, agents,
# runner and model, so the pair measures the interface and nothing else.

defaults:
  - /examples/planner_multi_agent_demo_config
  - override /evaluation: decentralized_evaluation_runner_skill_memory_v2
  - override /planner@evaluation.agents.agent_0.planner: skill_memory_v2_typed_planner
  - override /planner@evaluation.agents.agent_1.planner: skill_memory_v2_typed_planner
  - override /llm@evaluation.agents.agent_0.planner.plan_config.llm: vllm
  - override /llm@evaluation.agents.agent_1.planner.plan_config.llm: vllm
  - override /agent@evaluation.agents.agent_1.config: oracle_rearrange_object_states_agent

agent_asymmetry: True
world_model:
  partial_obs: True
