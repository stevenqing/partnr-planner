# @package _global_

defaults:
  - /examples/planner_multi_agent_demo_config
  - override /evaluation: decentralized_evaluation_runner_multi_agent
  - override /planner@evaluation.agents.agent_0.planner: llm_zero_shot_react_planner
  - override /instruct@evaluation.agents.agent_0.planner.plan_config.instruct: zero_shot_prompt_qwen
  - override /llm@evaluation.agents.agent_0.planner.plan_config.llm: qwen
  - override /agent@evaluation.agents.agent_0.config: oracle_rearrange_agent_motortoolsonly
  - override /planner@evaluation.agents.agent_1.planner: llm_zero_shot_react_planner
  - override /instruct@evaluation.agents.agent_1.planner.plan_config.instruct: zero_shot_prompt_qwen
  - override /llm@evaluation.agents.agent_1.planner.plan_config.llm: qwen
  - override /agent@evaluation.agents.agent_1.config: oracle_rearrange_object_states_agent_motortoolsonly


agent_asymmetry: True
world_model:
  partial_obs: True

evaluation:
  agents:
    agent_0:
      planner:
        plan_config:
          # IMPORTANT: Disable constrained_generation for Qwen to avoid spacing issues
          # Qwen works better without grammar-constrained generation
          constrained_generation: False
          objects_response: True
          replanning_threshold: 50
    agent_1:
      planner:
        plan_config:
          # IMPORTANT: Disable constrained_generation for Qwen to avoid spacing issues
          # Qwen works better without grammar-constrained generation
          constrained_generation: False
          objects_response: True
          replanning_threshold: 50
