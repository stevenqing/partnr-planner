# @package _global_
# PARTNR's own trajectory retrieval, restricted to the half of the training split skill
# memory v2 induces its operators from.
#
# baselines/react_rag_vllm.yaml retrieves over every task type, so it has seen spatial and
# temporal demonstrations the operators never did. That arm answers "is retrieval enough".
# This one holds the training material fixed across the arms and so answers the question
# the paper asks: given the same rearrange-only experience, whose memory composes?
#
# Pool built by:
#   python scripts/partnr_make_rag_source.py --split train_mini --types R \
#       --out results/rag_source_train_mini_R
#
# The instruct override is not cosmetic: `LLMPlanner` only consults the memory when the
# prompt contains `{rag_examples}`, and the stock few-shot decentralized instructs do not.
# Without it this arm builds a retriever and never shows the model a single retrieved
# thing -- which is exactly what the first `react_rag` run did.

defaults:
  - /baselines/react_rag_vllm
  - override /instruct@evaluation.agents.agent_0.planner.plan_config.instruct: few_shot_decentralized_partial_robot_spatialobjstates_memory_instruct
  - override /instruct@evaluation.agents.agent_1.planner.plan_config.instruct: few_shot_decentralized_partial_human_spatialobjstates_memory_instruct

evaluation:
  agents:
    agent_0:
      planner:
        plan_config:
          rag_dataset_dir: ["results/rag_source_train_mini_R/"]
    agent_1:
      planner:
        plan_config:
          rag_dataset_dir: ["results/rag_source_train_mini_R/"]
