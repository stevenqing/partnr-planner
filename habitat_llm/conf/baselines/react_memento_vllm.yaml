# @package _global_
# The MEMENTO-style user-profile memory as the memory, the ReAct planner as the consumer.
#
# Two node types -- object semantics and task pattern -- retrieved separately and rendered
# into the same `{rag_examples}` slot as every other prompt-shaped arm. Built from the same
# 161 rearrange-only train_mini rollouts as the operators.
#
# `memory_extractions` is MEMENTO's own first step (a model names the entities the
# instruction relies on) precomputed per instruction. It is a pure function of the
# instruction and the instruction does not change within an episode, so precomputing it
# changes nothing about the arm and keeps one answer from costing fifty identical calls.
#
# This is MEMENTO's architecture carrying PARTNR's content, not MEMENTO on its own
# benchmark: its memory is about a persistent user, and this split has none. No number
# from this arm may be reported as MEMENTO's published result.
#
# The instruct override is not cosmetic: `LLMPlanner` only consults the memory when the
# prompt contains `{rag_examples}`, and the stock few-shot decentralized instructs do not.
# Without it this arm builds a retriever and never shows the model a single retrieved
# thing -- which is exactly what the first `react_rag` run did.

defaults:
  - /baselines/react_vllm
  - override /instruct@evaluation.agents.agent_0.planner.plan_config.instruct: few_shot_decentralized_partial_robot_spatialobjstates_memory_instruct
  - override /instruct@evaluation.agents.agent_1.planner.plan_config.instruct: few_shot_decentralized_partial_human_spatialobjstates_memory_instruct

evaluation:
  agents:
    agent_0:
      planner:
        plan_config:
          enable_rag: True
          example_type: "memento"
          memory_store: "results/partnr_memento_train_mini_R.json"
          memory_extractions: "results/partnr_memento_extractions_val_mini.json"
          memory_device: "cpu"
    agent_1:
      planner:
        plan_config:
          enable_rag: True
          example_type: "memento"
          memory_store: "results/partnr_memento_train_mini_R.json"
          memory_extractions: "results/partnr_memento_extractions_val_mini.json"
          memory_device: "cpu"
